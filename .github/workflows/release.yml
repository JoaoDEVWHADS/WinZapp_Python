# Manual Trigger Commit - Rollback to edb0388
name: Release WinZapp

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: "Versão da Release (Deixe em branco para usar a data/hora atual)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Código-Fonte
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Definir Versão da Release
        shell: pwsh
        run: |
          $ver = "${{ inputs.version }}"
          if ([string]::IsNullOrEmpty($ver)) {
              $ver = Get-Date -Format "yyyy.MM.dd.HHmm"
          }
          echo "RELEASE_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "[INFO] Versão definida para: $ver"

      - name: Atualizar versão no version.py
        shell: pwsh
        run: |
          $ver = "${{ env.RELEASE_VERSION }}"
          $filePath = "client/version.py"
          $content = "__version__ = `"$ver`""
          $content | Out-File -FilePath $filePath -Encoding utf8 -NoNewline
          Write-Output "[INFO] Arquivo version.py atualizado para a versão $ver."

      - name: Configurar Git, Commit e Tag
        shell: pwsh
        run: |
          $ver = "${{ env.RELEASE_VERSION }}"
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add client/version.py
          $status = git status --porcelain
          if ($status) {
              git commit -m "chore: bump version to $ver [skip ci]"
          }
          git tag -f "v$ver"
          git pull origin main --rebase
          git push origin HEAD:main
          git push origin "v$ver" --force
          Write-Output "[INFO] Alterações enviadas e tag v$ver criada."

      - name: Configurar Arquivos .env
        shell: pwsh
        run: |
          $envContent = @"
          WPPCONNECT_TAG_VERSION=2.10.0
          WPPCONNECT_API_MINIMUM_VERSION=2.10.0
          LICENSING_USER_EMAIL=gabrielhaberkamp@gmail.com
          "@
          $envContent | Out-File -FilePath ".env" -Encoding utf8
          $envContent | Out-File -FilePath "client/.env" -Encoding utf8
          Write-Output "[INFO] Arquivos .env criados para o build."

      - name: Configurar Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Instalar Dependências do Python
        run: |
          python -m venv venv
          ./venv/Scripts/python -m pip install --upgrade pip
          ./venv/Scripts/pip install -r requirements.txt
          ./venv/Scripts/pip install -r requirements-dev.txt

      - name: Configurar MSYS2 (para gcc e windres)
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-binutils

      - name: Adicionar MSYS2 GCC ao Path do Windows
        shell: pwsh
        run: |
          $msysBin = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          echo $msysBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Output "[INFO] MSYS2 UCRT64 bin adicionado ao GITHUB_PATH: $msysBin"

      - name: Copiar DLL do bassopus para client/lib
        run: |
          New-Item -ItemType Directory -Force client\lib | Out-Null
          # bassopus.dll already committed in client/lib/ — verify both names exist
          if (Test-Path "client\lib\bass_opus.dll") {
            Copy-Item "client\lib\bass_opus.dll" "client\lib\bassopus.dll" -Force
            Write-Output "[INFO] bassopus.dll copied from bass_opus.dll"
          }
          if (Test-Path "client\lib\bassopus.dll") {
            Write-Output "[INFO] bassopus.dll is present in client/lib"
          } else {
            Write-Warning "[WARN] bassopus.dll not found in client/lib — OGG Opus playback will fail"
          }

      - name: Baixar e Extrair Node.js Portátil
        shell: pwsh
        run: |
          $version = "20.11.1"
          $zip = "node-v${version}-win-x64.zip"
          Invoke-WebRequest "https://nodejs.org/dist/v${version}/${zip}" -OutFile $zip -UseBasicParsing
          Expand-Archive $zip -DestinationPath . -Force
          if (Test-Path "client\node") { Remove-Item -Recurse -Force "client\node" }
          Move-Item "node-v${version}-win-x64" "client\node"
          Remove-Item -Force $zip

      - name: Baixar e Extrair MinGit Portátil
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "client/git"
          Invoke-WebRequest -Uri "https://github.com/git-for-windows/git/releases/download/v2.44.0.windows.1/MinGit-2.44.0-64-bit.zip" -OutFile "mingit-portable.zip" -UseBasicParsing
          Expand-Archive -Path "mingit-portable.zip" -DestinationPath "client/git" -Force
          Remove-Item -Force "mingit-portable.zip"


      - name: Cache API node_modules
        uses: actions/cache@v4
        with:
          path: client/api/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('client/api/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Configurar Servidor WPPConnect
        shell: pwsh
        run: |
          ./venv/Scripts/python.exe setup_api.py

      - name: Instalar Dependências e Compilar WPPConnect API
        env:
          PUPPETEER_SKIP_DOWNLOAD: "1"
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "1"
        shell: pwsh
        run: |
          $node = "$env:GITHUB_WORKSPACE\client\node\node.exe"
          $npm  = "$env:GITHUB_WORKSPACE\client\node\node_modules\npm\bin\npm-cli.js"

          Set-Location "$env:GITHUB_WORKSPACE\client\api"

          & $node $npm install --no-audit --no-fund --legacy-peer-deps

          $scripts = (Get-Content "package.json" | ConvertFrom-Json).scripts
          if ($null -ne $scripts.'db:generate') {
            & $node $npm run db:generate
          }

          & $node $npm run build

      - name: Compilar WinZapp com PyInstaller e Gerar Instalador
        shell: pwsh
        run: |
          $msysBin = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          $env:PATH = "$msysBin;$env:PATH"
          ./venv/Scripts/python.exe build.py

      - name: Verificar Integridade do dist/WinZapp.zip
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("dist\WinZapp.zip")
          try {
            $entries = $zip.Entries | ForEach-Object { $_.FullName }
            $hasExe      = ($entries | Where-Object { $_ -eq "WinZapp/WinZapp.exe" }).Count -gt 0
            $hasNodeExe  = ($entries | Where-Object { $_ -eq "WinZapp/node/node.exe" }).Count -gt 0
            $hasServerJs = ($entries | Where-Object { $_ -eq "WinZapp/api/dist/server.js" }).Count -gt 0
            Write-Host "[VERIFY] WinZapp.exe        : $hasExe"
            Write-Host "[VERIFY] node/node.exe      : $hasNodeExe"
            Write-Host "[VERIFY] api/dist/server.js : $hasServerJs"
            if (-not ($hasExe -and $hasNodeExe -and $hasServerJs)) {
              Write-Error "dist/WinZapp.zip missing critical executables — build failed."
              exit 1
            }
          } finally {
            $zip.Dispose()
          }

      - name: Gerar SHA256SUMS.txt
        shell: pwsh
        run: |
          $lines = @()
          foreach ($f in @("dist/WinZappInstaller.exe", "dist/WinZapp.zip")) {
            if (Test-Path $f) {
              $hash = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
              $name = Split-Path $f -Leaf
              $lines += "$hash  $name"
            }
          }
          $lines | Out-File -FilePath "dist/SHA256SUMS.txt" -Encoding ascii
          Write-Output "[INFO] dist/SHA256SUMS.txt gerado com sucesso."

      - name: Criar GitHub Release e Fazer Upload dos Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: Versão ${{ env.RELEASE_VERSION }}
          make_latest: "true"
          files: |
            dist/WinZappInstaller.exe
            dist/WinZapp.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true

      - name: Garantir Selo Latest Release na API do GitHub
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ env.RELEASE_VERSION }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 5
            });
            const targetTag = `v${process.env.RELEASE_VERSION}`;
            const targetRelease = releases.data.find(r => r.tag_name === targetTag) || releases.data[0];
            if (targetRelease) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: targetRelease.id,
                make_latest: "true"
              });
              console.log(`[INFO] Release ${targetRelease.tag_name} promovida com sucesso para LATEST no GitHub!`);
            }
